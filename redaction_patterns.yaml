# VoxMea - Redaction Patterns
# Regex patterns for detecting and masking sensitive information.
# Patterns are applied in order; each match is replaced with [REDACTED:<name>].
# Set a pattern to null or empty to disable it.

patterns:
  email: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'
  phone: '\b(?:\+?\d{1,3}[-.\s]?)?\(?\d{2,4}\)?[-.\s]?\d{2,4}[-.\s]?\d{2,4}\b'
  ssn: '\b\d{3}[-]?\d{2}[-]?\d{4}\b'
  credit_card: '\b(?:\d{4}[- ]?){3}\d{4}\b'
  url: 'https?://(?:[-\w.]|(?:%[\da-fA-F]{2}))+[^\s]*'
  ip_address: '\b(?:\d{1,3}\.){3}\d{1,3}\b'
  address_street: '\b\d{1,5}\s+(?:[A-Za-z]+\.?\s?){1,4}(?:Street|St|Avenue|Ave|Road|Rd|Boulevard|Blvd|Lane|Ln|Drive|Dr|Way|Court|Ct|Circle|Cir)\b'
  postal_code: '\b\d{5}(?:-\d{4})?\b'

custom_patterns:
  # Add your own patterns here
  # example_username: '\b@\w+\b'
